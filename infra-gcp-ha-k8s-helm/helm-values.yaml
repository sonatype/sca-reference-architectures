# Placeholder values. render-values.sh, called by helm-install.sh and helm-upgrade.sh,
# fills them from Terraform outputs.

iq_server:
  image: "sonatype/nexus-iq-server"
  tag: "latest"
  imagePullPolicy: "Always"

  resources:
    requests:
      cpu: "6"
      memory: "48Gi"
    limits:
      cpu: "8"
      memory: "56Gi"

  javaOpts: "-Xms48g -Xmx48g -XX:MaxDirectMemorySize=4g -XX:+UseG1GC -XX:+AlwaysPreTouch -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/sonatype-work/Java_Heap_logs -XX:+CrashOnOutOfMemoryError -Dinsight.threads.monitor=10 -Djava.util.prefs.userRoot=/sonatype-work/javaprefs"

  # GKE taints Arm nodes with kubernetes.io/arch=arm64:NoSchedule and this root's node
  # pool is Arm, so every pod the chart starts tolerates it (iq_server_jobs,
  # aggregateLogFileRetention and fluentd.aggregator below too).
  tolerations:
    - key: "kubernetes.io/arch"
      operator: "Equal"
      value: "arm64"
      effect: "NoSchedule"

  env:
    - name: NXIQ_DATABASE_MIGRATION
      value: "true"
    - name: CLUSTER_DIRECTORY
      value: "/sonatype-work/clm-cluster"
    - name: NEXUS_SECURITY_RANDOMPASSWORD
      value: "false"
    - name: DB_HOSTNAME
      value: ""
    - name: DB_PORT
      value: "5432"
    - name: DB_NAME
      value: "nexusiq"
    - name: DB_USERNAME
      value: "nexusiq"
    - name: DB_PASSWORD
      value: ""
    # opensearch-ca-begin
    - name: OPENSEARCH_CA_PEM
      valueFrom:
        secretKeyRef:
          name: nexus-iq-opensearch-ca
          key: ca.pem
    # opensearch-ca-end

  licenseSecret: "nexus-iq-license"

  database:
    hostname: ""
    port: 5432
    name: "nexusiq"
    username: "nexusiq"
    password: ""
    type: "postgresql"
    migration: true

  persistence:
    existingPersistentVolumeClaimName: "nexus-iq-pvc"

  serviceAccountName: "nexus-iq-sa"

  serviceType: "NodePort"

  # A private certificate authority for the OpenSearch cluster. render-values.sh keeps
  # the lines between the markers only when opensearch_ca_certificate is set. Each pod adds
  # the authority to a copy of the JVM trust store, which keeps the default authorities.
  # opensearch-ca-begin
  command: ["/bin/sh", "-c"]
  args:
    - |
      set -e
      printf '%s\n' "$OPENSEARCH_CA_PEM" > /tmp/opensearch-ca.pem
      JVM_CACERTS=$(find / \( -path /sonatype-work -o -path /proc -o -path /sys \) -prune -o -name cacerts -path "*lib/security*" -print 2>/dev/null | head -1)
      KEYTOOL=$(find / \( -path /sonatype-work -o -path /proc -o -path /sys \) -prune -o -name keytool -type f -perm -u+x -print 2>/dev/null | head -1)
      [ -n "$JVM_CACERTS" ] && [ -n "$KEYTOOL" ] || { echo "cacerts=$JVM_CACERTS keytool=$KEYTOOL, one is missing"; exit 1; }
      cp "$JVM_CACERTS" /tmp/opensearch-cacerts
      "$KEYTOOL" -importcert -noprompt -keystore /tmp/opensearch-cacerts -storepass changeit -alias opensearch-ca -file /tmp/opensearch-ca.pem
      export JAVA_OPTS="$JAVA_OPTS -Djavax.net.ssl.trustStore=/tmp/opensearch-cacerts -Djavax.net.ssl.trustStorePassword=changeit"
      exec sh /opt/sonatype/nexus-iq-server/start.sh
  # opensearch-ca-end

  # IQ pods, the Size L value. helm-install.sh sets it from nexus_iq_replica_count.
  replicas: 3

  config:
    sonatypeWork: "/sonatype-work"
    clusterDirectory: "/sonatype-work/clm-cluster"
    createSampleData: true

    # Search backend. render-values.sh fills the placeholders when search_engine is
    # "opensearch" and deletes everything between the markers otherwise, so keep the markers
    # and add nothing else between them.
    # search-block-begin
    search:
      type: http
      mode: OPENSEARCH
      uri: OPENSEARCH_URI_PLACEHOLDER
      username: OPENSEARCH_USERNAME_PLACEHOLDER
      password: OPENSEARCH_PASSWORD_PLACEHOLDER
    # The Nexus One index reads only nexusOne.connection, including nexusOneIndexReplicas;
    # without it, enabling the nexus-one feature is refused.
    nexusOne:
      connection:
        type: http
        mode: OPENSEARCH
        uri: OPENSEARCH_URI_PLACEHOLDER
        username: OPENSEARCH_USERNAME_PLACEHOLDER
        password: OPENSEARCH_PASSWORD_PLACEHOLDER
        nexusOneIndexReplicas: OPENSEARCH_REPLICAS_PLACEHOLDER
    # search-block-end

    server:
      applicationConnectors:
        - type: http
          port: 8070
      adminConnectors:
        - type: http
          port: 8071
      requestLog:
        appenders:
          - type: file
            currentLogFilename: "/var/log/nexus-iq-server/request.log"
            archivedLogFilenamePattern: "/var/log/nexus-iq-server/request-%d.log.gz"
            archivedFileCount: 50

    logging:
      level: DEBUG
      loggers:
        com.sonatype.insight.scan: INFO
        eu.medsea.mimeutil.MimeUtil2: INFO
        org.apache.http: INFO
        org.apache.http.wire: ERROR
        org.eclipse.birt.report.engine.layout.pdf.font.FontConfigReader: WARN
        org.eclipse.jetty: INFO
        org.apache.shiro.web.filter.authc.BasicHttpAuthenticationFilter: INFO
        com.networknt.schema: false
        com.sonatype.insight.audit:
          appenders:
            - type: file
              currentLogFilename: "/var/log/nexus-iq-server/audit.log"
              archivedLogFilenamePattern: "/var/log/nexus-iq-server/audit-%d.log.gz"
              archivedFileCount: 50
        com.sonatype.insight.policy.violation:
          appenders:
            - type: file
              currentLogFilename: "/var/log/nexus-iq-server/policy-violation.log"
              archivedLogFilenamePattern: "/var/log/nexus-iq-server/policy-violation-%d.log.gz"
              archivedFileCount: 50
      appenders:
        - type: console
          threshold: DEBUG
          logFormat: "%d{'yyyy-MM-dd HH:mm:ss,SSSZ'} %level [%thread] %X{username} %logger - %msg%n"
        - type: file
          threshold: ALL
          currentLogFilename: "/var/log/nexus-iq-server/clm-server.log"
          archivedLogFilenamePattern: "/var/log/nexus-iq-server/clm-server-%d.log.gz"
          logFormat: "%d{'yyyy-MM-dd HH:mm:ss,SSSZ'} %level [%thread] %X{username} %logger - %msg%n"
          archivedFileCount: 50

# The database migration Job the chart always renders.
iq_server_jobs:
  tolerations:
    - key: "kubernetes.io/arch"
      operator: "Equal"
      value: "arm64"
      effect: "NoSchedule"

# The CronJob that deletes aggregated log files older than maxLastModifiedDays.
aggregateLogFileRetention:
  tolerations:
    - key: "kubernetes.io/arch"
      operator: "Equal"
      value: "arm64"
      effect: "NoSchedule"

serviceAccount:
  create: true
  name: "nexus-iq-sa"
  annotations:
    iam.gke.io/gcp-service-account: ""

cloudLogging:
  enabled: true
  projectId: ""
  logName: "nexus-iq-server"

ingress:
  enabled: false
  ingressClassName: "gce"
  annotations:
    kubernetes.io/ingress.class: "gce"
    kubernetes.io/ingress.global-static-ip-name: ""
    kubernetes.io/ingress.allow-http: "true"
    ingress.gcp.kubernetes.io/pre-shared-cert: ""
  # Only expose the application service (not admin service) for GCE Ingress
  service:
    name: "nexus-iq-server-ha-iq-server-application-service"
    port: 8070

fluentd:
  enabled: true

  image:
    repository: bitnamilegacy/fluentd
    tag: "1.17.1-debian-12-r4"
    pullPolicy: IfNotPresent

  cloudLogging:
    enabled: true
    projectId: ""
    logName: "nexus-iq-server"

  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "200m"
      memory: "256Mi"

  aggregator:
    enabled: true
    tolerations:
      - key: "kubernetes.io/arch"
        operator: "Equal"
        value: "arm64"
        effect: "NoSchedule"
    serviceAccount:
      create: true
      name: "fluentd-aggregator-sa"
      annotations:
        iam.gke.io/gcp-service-account: ""
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      runAsNonRoot: true
    extraVolumes:
      - name: "iq-server-pod-volume"
        persistentVolumeClaim:
          claimName: "nexus-iq-pvc"
    initContainers:
      - name: "set-fluentd-persistence-ownership"
        image: busybox:latest
        command: ["/bin/sh", "-c"]
        args: ["mkdir -p /opt/bitnami/fluentd/logs/nexus-iq-server"]
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
        volumeMounts:
          - mountPath: "/opt/bitnami/fluentd/logs/nexus-iq-server"
            name: "iq-server-pod-volume"
            subPath: log

external-dns:
  enabled: false

migrationJob:
  enabled: false

# Size L bounds. Memory stays disabled: the JVM holds its heap, so memory use sits
# near the limit and would scale out without bound.
hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  resources:
    cpu:
      enabled: true
      average:
        threshold: 70
    memory:
      enabled: false

podAntiAffinity:
  enabled: true
  topologyKey: "kubernetes.io/hostname"

podDisruptionBudget:
  enabled: true
  minAvailable: 1
