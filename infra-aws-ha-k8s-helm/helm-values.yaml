
iq_server:
  image: "sonatype/nexus-iq-server"
  # No tag here. The chart sets it, so IQ Server always matches helm_chart_version in variables.tf.
  imagePullPolicy: "IfNotPresent"

  resources:
    requests:
      cpu: "6"
      memory: "25Gi"
    limits:
      cpu: "8"
      memory: "26Gi"

  javaOpts: "-Xms17g -Xmx17g -XX:MaxDirectMemorySize=4g -XX:+UseG1GC -XX:+AlwaysPreTouch -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/sonatype-work/clm-cluster/heap-dump.hprof -XX:+ExitOnOutOfMemoryError -Dinsight.threads.monitor=10 -Djava.util.prefs.userRoot=/sonatype-work/javaprefs"

  env:
    - name: CLUSTER_DIRECTORY
      value: "/sonatype-work/clm-cluster"
    - name: NEXUS_SECURITY_RANDOMPASSWORD
      value: "false"

  licenseSecret: "nexus-iq-license"

  # helm-install.sh creates this secret from iq_admin_initial_password. IQ Server
  # reads it on its very first start only.
  initialAdminPasswordSecret: "nexus-iq-initial-admin-password"

  database:
    hostname: ""
    port: 5432
    name: "nexusiq"
    username: "nexusiq"
    password: ""

  persistence:
    existingPersistentVolumeClaimName: "iq-server-pvc"

  serviceAccountName: "nexus-iq-sa"

  serviceType: "ClusterIP"

  # Number of IQ pods. The chart reads iq_server.replicas and defaults it to 2.
  # This is the Size M value, the HPA minimum. Size L uses 2 and Size XL uses 3.
  # helm-install.sh overwrites it with nexus_iq_replica_count from terraform.tfvars.
  replicas: 2

  config:
    sonatypeWork: "/sonatype-work"
    clusterDirectory: "/sonatype-work/clm-cluster"
    createSampleData: true

    # BEGIN search backend
    # helm-install.sh and helm-upgrade.sh fill the three placeholders below from
    # Terraform when search_engine is "opensearch", and delete everything between
    # these two markers when it is "lucene", which is the default. Leave the
    # markers, the indentation and the placeholder names alone.
    #
    # The values here are placeholders on purpose. Both scripts first substitute
    # default values over the whole file for the database, such as hostname: "",
    # with no line anchor. A key here holding one of those defaults would be
    # handed the database value, so these keys hold placeholders that are filled
    # in after those substitutions run.
    # Advanced Search reads this block.
    search:
      type: aws
      mode: OPENSEARCH
      domain: "https://OPENSEARCH_DOMAIN_PLACEHOLDER"
      region: "OPENSEARCH_REGION_PLACEHOLDER"
      nexusOneIndexReplicas: OPENSEARCH_REPLICAS_PLACEHOLDER

    # The Nexus One index reads this block. Both blocks name the same domain.
    nexusOne:
      connection:
        type: aws
        mode: OPENSEARCH
        domain: "https://OPENSEARCH_DOMAIN_PLACEHOLDER"
        region: "OPENSEARCH_REGION_PLACEHOLDER"
        nexusOneIndexReplicas: OPENSEARCH_REPLICAS_PLACEHOLDER
    # END search backend

    server:
      applicationConnectors:
        - type: http
          port: 8070
      adminConnectors:
        - type: http
          port: 8071
      # Every log goes to stdout, for the cluster's log agent, and to a per-pod file on
      # the shared volume, where the support zip and the chart's cleanup job find it.
      requestLog:
        appenders:
          - type: console
          - type: file
            currentLogFilename: "/sonatype-work/clm-cluster/log/${HOSTNAME}-request.log"
            archivedLogFilenamePattern: "/sonatype-work/clm-cluster/log/${HOSTNAME}-request-%d.log.gz"
            archivedFileCount: 50

    logging:
      level: INFO
      loggers:
        com.sonatype.insight.scan: INFO
        eu.medsea.mimeutil.MimeUtil2: INFO
        org.apache.http: INFO
        org.apache.http.wire: ERROR
        org.apache.hc.client5.http: INFO
        org.apache.hc.client5.http.wire: ERROR
        org.apache.hc.core5.reactor: INFO
        org.apache.http.client.protocol.ResponseProcessCookies: ERROR
        org.postgresql.jdbc.PgConnection: INFO
        org.quartz: INFO
        org.zeroturnaround.exec: INFO
        org.eclipse.jgit: INFO
        software.amazon.awssdk: WARN
        org.jooq.tools: WARN
        org.jooq.Constants: "OFF"
        org.eclipse.birt.report.engine.layout.pdf.font.FontConfigReader: WARN
        org.eclipse.jetty: INFO
        org.apache.shiro.web.filter.authc.BasicHttpAuthenticationFilter: INFO
        com.networknt.schema: false
        com.sonatype.insight.audit:
          appenders:
            - type: console
            - type: file
              currentLogFilename: "/sonatype-work/clm-cluster/log/${HOSTNAME}-audit.log"
              archivedLogFilenamePattern: "/sonatype-work/clm-cluster/log/${HOSTNAME}-audit-%d.log.gz"
              archivedFileCount: 50
        com.sonatype.insight.policy.violation:
          appenders:
            - type: console
            - type: file
              currentLogFilename: "/sonatype-work/clm-cluster/log/${HOSTNAME}-policy-violation.log"
              archivedLogFilenamePattern: "/sonatype-work/clm-cluster/log/${HOSTNAME}-policy-violation-%d.log.gz"
              archivedFileCount: 50
      appenders:
        - type: console
          threshold: INFO
          logFormat: "%d{'yyyy-MM-dd HH:mm:ss,SSSZ'} %level [%thread] %X{username} %logger - %msg%n"
        - type: file
          threshold: ALL
          currentLogFilename: "/sonatype-work/clm-cluster/log/${HOSTNAME}-clm-server.log"
          archivedLogFilenamePattern: "/sonatype-work/clm-cluster/log/${HOSTNAME}-clm-server-%d{yyyy-MM-dd-HH}.log.gz"
          logFormat: "%d{'yyyy-MM-dd HH:mm:ss,SSSZ'} %level [%thread] %X{username} %logger - %msg%n"
          archivedFileCount: 24

serviceAccount:
  create: true
  # helm-install.sh and helm-upgrade.sh fill this with the iq_server_irsa_role_arn
  # Terraform output when search_engine is "opensearch", and leave it empty otherwise.
  annotations:
    eks.amazonaws.com/role-arn: ""

# Horizontal pod autoscaler. The chart reads hpa.enabled, hpa.minReplicas and
# hpa.maxReplicas, and renders the HPA only when a resource metric is enabled.
# These are the Size M bounds, 2 to 3. Size L is 2 to 4 and Size XL is 3 to 5.
# Memory is left disabled because the JVM holds its heap, so memory utilization
# stays near the limit and would scale out without bound.
hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 3
  resources:
    cpu:
      enabled: true
      average:
        threshold: 70
    memory:
      enabled: false

ingress:
  enabled: true
  ingressClassName: "alb"
  annotations:
    alb.ingress.kubernetes.io/scheme: "internet-facing"
    alb.ingress.kubernetes.io/target-type: "ip"
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    alb.ingress.kubernetes.io/healthcheck-path: "/ping"

# The database migration job runs once, as a post-install hook, so a helm upgrade does
# not start it again while IQ Server is using the database. helm waits for a hook and
# fails the install if the migration fails. When an upgrade changes the IQ Server image,
# MIGRATE_DATABASE=yes ./helm-upgrade.sh scales IQ Server to zero and runs the job as a
# pre-upgrade hook.
iq_server_jobs:
  migrationJobAnnotations:
    "helm.sh/hook": post-install
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded