
iq_server:
  image: "sonatype/nexus-iq-server"
  tag: "latest"
  imagePullPolicy: "Always"

  resources:
    requests:
      cpu: "6"
      memory: "48Gi"
    limits:
      cpu: "8"
      memory: "56Gi"

  javaOpts: "-Xms48g -Xmx48g -XX:MaxDirectMemorySize=4g -XX:+UseG1GC -XX:+AlwaysPreTouch -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/sonatype-work/Java_Heap_logs -XX:+CrashOnOutOfMemoryError -Dinsight.threads.monitor=10 -Djava.util.prefs.userRoot=/sonatype-work/javaprefs"

  env:
    - name: NXIQ_DATABASE_MIGRATION
      value: "true"
    - name: CLUSTER_DIRECTORY
      value: "/sonatype-work/clm-cluster"
    - name: NEXUS_SECURITY_RANDOMPASSWORD
      value: "false"
    - name: DB_HOSTNAME
      value: ""
    - name: DB_PORT
      value: "5432"
    - name: DB_NAME
      value: "nexusiq"
    - name: DB_USERNAME
      value: "nexusiq"
    - name: DB_PASSWORD
      value: ""

  licenseSecret: "nexus-iq-license"

  database:
    hostname: ""
    port: 5432
    name: "nexusiq"
    username: "nexusiq"
    password: ""
    type: "postgresql"
    migration: true

  persistence:
    existingPersistentVolumeClaimName: "iq-server-pvc"

  serviceAccountName: "nexus-iq-sa"

  serviceType: "ClusterIP"

  # IQ pods, the Size L value. helm-install.sh sets it from nexus_iq_replica_count.
  replicas: 3

  config:
    sonatypeWork: "/sonatype-work"
    clusterDirectory: "/sonatype-work/clm-cluster"
    createSampleData: true

    # BEGIN search backend
    # The scripts fill the placeholders below when search_engine is "opensearch"
    # and delete everything between the markers when it is "lucene". Keep the
    # markers and placeholder names. The keys hold placeholders because the
    # scripts' earlier unanchored substitutions would overwrite a real default.
    # Advanced Search reads this block.
    search:
      type: aws
      mode: OPENSEARCH
      domain: "https://OPENSEARCH_DOMAIN_PLACEHOLDER"
      region: "OPENSEARCH_REGION_PLACEHOLDER"
      nexusOneIndexReplicas: OPENSEARCH_REPLICAS_PLACEHOLDER

    # The Nexus One index reads only nexusOne.connection, so it names the same
    # domain again; without it, enabling the nexus-one feature is refused.
    nexusOne:
      connection:
        type: aws
        mode: OPENSEARCH
        domain: "https://OPENSEARCH_DOMAIN_PLACEHOLDER"
        region: "OPENSEARCH_REGION_PLACEHOLDER"
        nexusOneIndexReplicas: OPENSEARCH_REPLICAS_PLACEHOLDER
    # END search backend

    server:
      applicationConnectors:
        - type: http
          port: 8070
      adminConnectors:
        - type: http
          port: 8071
      requestLog:
        appenders:
          - type: file
            currentLogFilename: "/var/log/nexus-iq-server/request.log"
            archivedLogFilenamePattern: "/var/log/nexus-iq-server/request-%d.log.gz"
            archivedFileCount: 50

    logging:
      level: INFO
      loggers:
        com.sonatype.insight.scan: INFO
        eu.medsea.mimeutil.MimeUtil2: INFO
        org.apache.http: INFO
        org.apache.http.wire: ERROR
        org.apache.hc.client5.http: INFO
        org.apache.hc.client5.http.wire: ERROR
        org.apache.hc.core5.reactor: INFO
        org.apache.http.client.protocol.ResponseProcessCookies: ERROR
        org.postgresql.jdbc.PgConnection: INFO
        org.quartz: INFO
        org.zeroturnaround.exec: INFO
        org.eclipse.jgit: INFO
        software.amazon.awssdk: WARN
        org.jooq.tools: WARN
        org.jooq.Constants: "OFF"
        org.eclipse.birt.report.engine.layout.pdf.font.FontConfigReader: WARN
        org.eclipse.jetty: INFO
        org.apache.shiro.web.filter.authc.BasicHttpAuthenticationFilter: INFO
        com.networknt.schema: false
        com.sonatype.insight.audit:
          appenders:
            - type: file
              currentLogFilename: "/var/log/nexus-iq-server/audit.log"
              archivedLogFilenamePattern: "/var/log/nexus-iq-server/audit-%d.log.gz"
              archivedFileCount: 50
        com.sonatype.insight.policy.violation:
          appenders:
            - type: file
              currentLogFilename: "/var/log/nexus-iq-server/policy-violation.log"
              archivedLogFilenamePattern: "/var/log/nexus-iq-server/policy-violation-%d.log.gz"
              archivedFileCount: 50
      appenders:
        - type: console
          threshold: INFO
          logFormat: "%d{'yyyy-MM-dd HH:mm:ss,SSSZ'} %level [%thread] %X{username} %logger - %msg%n"
        - type: file
          threshold: ALL
          currentLogFilename: "/var/log/nexus-iq-server/clm-server.log"
          archivedLogFilenamePattern: "/var/log/nexus-iq-server/clm-server-%d{yyyy-MM-dd-HH}.log.gz"
          logFormat: "%d{'yyyy-MM-dd HH:mm:ss,SSSZ'} %level [%thread] %X{username} %logger - %msg%n"
          archivedFileCount: 24

serviceAccount:
  create: true
  name: "nexus-iq-sa"
  annotations:
    eks.amazonaws.com/role-arn: ""

# Size L bounds. Memory stays disabled: the JVM holds its heap, so memory use sits
# near the limit and would scale out without bound.
hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  resources:
    cpu:
      enabled: true
      average:
        threshold: 70
    memory:
      enabled: false

cloudwatch:
  enabled: true
  region: "us-east-1"
  logGroupName: "/eks/nexus-iq-ha/nexus-iq-server"
  logStreamName: "aggregator"

ingress:
  enabled: true
  ingressClassName: "alb"
  annotations:
    alb.ingress.kubernetes.io/scheme: "internet-facing"
    alb.ingress.kubernetes.io/target-type: "ip"
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    alb.ingress.kubernetes.io/healthcheck-path: "/ping"

fluentd:
  enabled: true

  image:
    repository: bitnamilegacy/fluentd
    tag: "1.17.1-debian-12-r4"
    pullPolicy: IfNotPresent

  cloudwatch:
    enabled: true
    region: "us-east-1"
    logGroupName: "/eks/nexus-iq-ha/nexus-iq-server"
    logStreamPrefix: "pod/"

  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "200m"
      memory: "256Mi"

  aggregator:
    enabled: true
    persistence:
      existingPersistentVolumeClaimName: "nexus-iq-pvc"
    serviceAccount:
      create: true
      annotations:
        eks.amazonaws.com/role-arn: ""
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      runAsNonRoot: true
    initContainers:
      - name: "{{ .Release.Name }}-set-fluentd-persistence-ownership"
        image: busybox:latest
        command: ["/bin/sh", "-c"]
        args: ["mkdir -p /opt/bitnami/fluentd/logs/nexus-iq-server && chmod 755 /opt/bitnami/fluentd/logs/nexus-iq-server"]
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
        volumeMounts:
          - mountPath: "/opt/bitnami/fluentd/logs/nexus-iq-server"
            name: "iq-server-pod-volume"
            subPath: log

external-dns:
  enabled: false

migrationJob:
  enabled: false