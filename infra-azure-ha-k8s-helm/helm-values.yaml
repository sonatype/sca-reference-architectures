



iq_server:
  image: "sonatype/nexus-iq-server"
  tag: "latest"
  imagePullPolicy: "Always"


  resources:
    requests:
      cpu: "6"
      memory: "48Gi"
    limits:
      cpu: "8"
      memory: "56Gi"


  javaOpts: "-Xms48g -Xmx48g -XX:MaxDirectMemorySize=4g -XX:+UseG1GC -XX:+AlwaysPreTouch -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/sonatype-work/clm-cluster/heap-dump.hprof -XX:+ExitOnOutOfMemoryError -Dinsight.threads.monitor=10 -Djava.util.prefs.userRoot=/sonatype-work/javaprefs"


  config:
    # Advanced Search backend. No search key is committed here: helm-install.sh
    # and helm-upgrade.sh, through search-values.sh, append one to
    # helm-values-runtime.yaml when search_engine is
    # "opensearch" in terraform.tfvars, and appends nothing when it is
    # "lucene".
    #
    # It is generated rather than committed because this file is rewritten by
    # an unanchored sed that replaces every empty password value with the
    # database password, so a committed OpenSearch password key would receive
    # it. The generated search: and nexusOne.connection blocks carry the
    # cluster's uri and credentials. README.md shows them in full.
    sonatypeWork: "/sonatype-work/clm-server"
    clusterDirectory: "/sonatype-work/clm-cluster"


  env:
    - name: CLUSTER_DIRECTORY
      value: "/sonatype-work/clm-cluster"
    - name: NEXUS_SECURITY_RANDOMPASSWORD
      value: "false"

    - name: DB_HOSTNAME
      value: ""
    - name: DB_PORT
      value: "5432"
    - name: DB_NAME
      value: "nexusiq"
    - name: DB_USERNAME
      value: "nexusiq"
    - name: DB_PASSWORD
      value: ""


  licenseSecret: "nexus-iq-license"


  database:
    hostname: ""
    port: 5432
    name: "nexusiq"
    username: "nexusiq"
    password: ""
    type: "postgresql"
    migration: true


  persistence:
    # helm-install.sh creates this claim, bound to a PersistentVolume on the
    # Terraform-created Azure Files share and sized from storage_share_quota_gb.
    existingPersistentVolumeClaimName: "iq-server-pvc"


  serviceAccountName: "nexus-iq-sa"


  serviceType: "LoadBalancer"
  serviceAnnotations:
    service.beta.kubernetes.io/azure-load-balancer-health-probe-request-path: "/ping"
    service.beta.kubernetes.io/azure-load-balancer-health-probe-protocol: "http"


  # Number of IQ pods. The chart reads iq_server.replicas and defaults it to 2.
  # This is the Size L value. Size M uses 2 and Size XL uses 4.
  # helm-install.sh overwrites it with nexus_iq_replica_count from terraform.tfvars.
  replicas: 3





  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                    - nexus-iq-server-ha
            topologyKey: "kubernetes.io/hostname"


  podDisruptionBudget:
    enabled: true
    minAvailable: 1


serviceAccount:
  create: true
  name: "nexus-iq-sa"
  annotations:

    azure.workload.identity/client-id: ""


ingress:
  enabled: false
  ingressClassName: "nginx"
  annotations:

    appgw.ingress.kubernetes.io/backend-path-prefix: "/"
    appgw.ingress.kubernetes.io/ssl-redirect: "false"
    appgw.ingress.kubernetes.io/connection-draining: "true"
    appgw.ingress.kubernetes.io/connection-draining-timeout: "30"
    appgw.ingress.kubernetes.io/request-timeout: "60"
    appgw.ingress.kubernetes.io/health-probe-path: "/ping"
    appgw.ingress.kubernetes.io/health-probe-interval: "30"
    appgw.ingress.kubernetes.io/health-probe-timeout: "30"
    appgw.ingress.kubernetes.io/health-probe-unhealthy-threshold: "3"
  hosts:
    - host: ""
      paths:
        - path: /
          pathType: Prefix
  tls: []


# Horizontal pod autoscaler. The chart reads hpa.enabled, hpa.minReplicas and
# hpa.maxReplicas, and renders the HPA only when a resource metric is enabled.
# These are the Size L bounds. Size M is 2 to 3 and Size XL is 3 to 5.
# Memory is left disabled because the JVM holds its heap, so memory utilization
# stays near the limit and would scale out without bound.
hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  resources:
    cpu:
      enabled: true
      average:
        threshold: 70
    memory:
      enabled: false


fluentd:
  enabled: true


  image:
    repository: bitnamilegacy/fluentd
    tag: "1.17.1-debian-12-r4"
    pullPolicy: IfNotPresent


  azureMonitor:
    enabled: true
    workspaceId: ""
    logType: "nexus-iq-server"


  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "200m"
      memory: "256Mi"

external-dns:
  enabled: false

migrationJob:
  enabled: false


livenessProbe:
  httpGet:
    path: /ping
    port: 8071
  initialDelaySeconds: 120
  periodSeconds: 60
  timeoutSeconds: 10
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /ping
    port: 8071
  initialDelaySeconds: 60
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 3


monitoring:
  enabled: true
  applicationInsights:
    enabled: true
    instrumentationKey: ""
