



iq_server:
  image: "sonatype/nexus-iq-server"
  tag: "latest"
  imagePullPolicy: "Always"


  resources:
    requests:
      cpu: "6"
      memory: "48Gi"
    limits:
      cpu: "8"
      memory: "56Gi"


  # Heap dumps go to this pod's directory on the Azure Files share, since the node's OS
  # disk is too small. The JVM takes the last HeapDumpPath, so this one wins.
  command: ["/bin/sh", "-c"]
  args:
    - |
      set -e
      mkdir -p "/sonatype-work/clm-cluster/heap-dumps/$HOSTNAME"
      export JAVA_OPTS="$JAVA_OPTS -XX:HeapDumpPath=/sonatype-work/clm-cluster/heap-dumps/$HOSTNAME"
      exec sh /opt/sonatype/nexus-iq-server/start.sh

  javaOpts: "-Xms48g -Xmx48g -XX:MaxDirectMemorySize=4g -XX:+UseG1GC -XX:+AlwaysPreTouch -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/sonatype-work/Java_Heap_logs -XX:+CrashOnOutOfMemoryError -Dinsight.threads.monitor=10 -Djava.util.prefs.userRoot=/sonatype-work/javaprefs"


  config:
    # Advanced Search backend. search-values.sh appends the search: and
    # nexusOne.connection blocks to helm-values-runtime.yaml when search_engine is
    # "opensearch". They are not committed here, because the scripts' unanchored sed
    # writes the database password into every empty password value.
    sonatypeWork: "/sonatype-work/clm-server"
    clusterDirectory: "/sonatype-work/clm-cluster"


  env:
    - name: NXIQ_DATABASE_MIGRATION
      value: "true"
    - name: CLUSTER_DIRECTORY
      value: "/sonatype-work/clm-cluster"
    - name: NEXUS_SECURITY_RANDOMPASSWORD
      value: "false"

    - name: DB_HOSTNAME
      value: ""
    - name: DB_PORT
      value: "5432"
    - name: DB_NAME
      value: "nexusiq"
    - name: DB_USERNAME
      value: "nexusiq"
    - name: DB_PASSWORD
      value: ""


  licenseSecret: "nexus-iq-license"


  database:
    hostname: ""
    port: 5432
    name: "nexusiq"
    username: "nexusiq"
    password: ""
    type: "postgresql"
    migration: true


  persistence:


    existingPersistentVolumeName: " "
    persistentVolumeClaimName: "iq-server-pvc"
    size: "100Gi"
    storageClassName: "azurefile-nfs"
    accessModes:
      - ReadWriteMany


  securityContext:
    readOnlyRootFilesystem: false


  serviceAccountName: "nexus-iq-sa"


  serviceType: "LoadBalancer"
  serviceAnnotations:
    service.beta.kubernetes.io/azure-load-balancer-health-probe-request-path: "/ping"
    service.beta.kubernetes.io/azure-load-balancer-health-probe-protocol: "http"


  # IQ pods, the Size L value. helm-install.sh sets it from nexus_iq_replica_count.
  replicas: 3





  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                    - nexus-iq-server-ha
            topologyKey: "kubernetes.io/hostname"


  podDisruptionBudget:
    enabled: true
    minAvailable: 1


serviceAccount:
  create: true
  name: "nexus-iq-sa"
  annotations:

    azure.workload.identity/client-id: ""


ingress:
  enabled: false
  ingressClassName: "nginx"
  annotations:

    appgw.ingress.kubernetes.io/backend-path-prefix: "/"
    appgw.ingress.kubernetes.io/ssl-redirect: "false"
    appgw.ingress.kubernetes.io/connection-draining: "true"
    appgw.ingress.kubernetes.io/connection-draining-timeout: "30"
    appgw.ingress.kubernetes.io/request-timeout: "60"
    appgw.ingress.kubernetes.io/health-probe-path: "/ping"
    appgw.ingress.kubernetes.io/health-probe-interval: "30"
    appgw.ingress.kubernetes.io/health-probe-timeout: "30"
    appgw.ingress.kubernetes.io/health-probe-unhealthy-threshold: "3"
  hosts:
    - host: ""
      paths:
        - path: /
          pathType: Prefix
  tls: []


# Size L bounds. Memory stays disabled: the JVM holds its heap, so memory use sits
# near the limit and would scale out without bound.
hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  resources:
    cpu:
      enabled: true
      average:
        threshold: 70
    memory:
      enabled: false


fluentd:
  enabled: true


  image:
    repository: bitnamilegacy/fluentd
    tag: "1.17.1-debian-12-r4"
    pullPolicy: IfNotPresent


  azureMonitor:
    enabled: true
    workspaceId: ""
    logType: "nexus-iq-server"


  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "200m"
      memory: "256Mi"

external-dns:
  enabled: false

migrationJob:
  enabled: false


azureFiles:
  enabled: true
  storageClass: "azure-files-premium-zrs"


livenessProbe:
  httpGet:
    path: /ping
    port: 8071
  initialDelaySeconds: 120
  periodSeconds: 60
  timeoutSeconds: 10
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /ping
    port: 8071
  initialDelaySeconds: 60
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 3


monitoring:
  enabled: true
  applicationInsights:
    enabled: true
    instrumentationKey: ""
