



iq_server:
  image: "sonatype/nexus-iq-server"
  # No tag here. The chart sets it, so IQ Server always matches helm_chart_version in variables.tf.
  imagePullPolicy: "IfNotPresent"


  resources:
    requests:
      cpu: "6"
      memory: "25Gi"
    limits:
      cpu: "8"
      memory: "26Gi"


  javaOpts: "-Xms17g -Xmx17g -XX:MaxDirectMemorySize=4g -XX:+UseG1GC -XX:+AlwaysPreTouch -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/sonatype-work/clm-cluster/heap-dump.hprof -XX:+ExitOnOutOfMemoryError -Dinsight.threads.monitor=10 -Djava.util.prefs.userRoot=/sonatype-work/javaprefs"


  config:
    # Advanced Search backend. No search key is committed here: helm-install.sh
    # and helm-upgrade.sh, through search-values.sh, append one to
    # helm-values-runtime.yaml when search_engine is
    # "opensearch" in terraform.tfvars, and appends nothing when it is
    # "builtin".
    #
    # It is generated rather than committed because this file is rewritten by
    # an unanchored sed that replaces every empty password value with the
    # database password, so a committed OpenSearch password key would receive
    # it. The generated search: and nexusOne.connection blocks carry the
    # cluster's uri and credentials. README.md shows them in full.
    sonatypeWork: "/sonatype-work/clm-server"
    clusterDirectory: "/sonatype-work/clm-cluster"
    logging:
      level: INFO
      loggers:
        "org.apache.hc.client5.http": INFO
        "org.apache.hc.client5.http.wire": ERROR
        "org.apache.hc.core5.reactor": INFO
        "org.apache.http.client.protocol.ResponseProcessCookies": ERROR
        "org.eclipse.jgit": INFO
        "software.amazon.awssdk": WARN
        "org.jooq.tools": WARN
        "org.jooq.Constants": "OFF"
      # Every log goes to stdout, for Container insights, and to a per-pod file on the
      # Azure Files share, where the support zip and the chart's cleanup job find it.
      # The request, audit and policy-violation logs keep the chart's appenders, which
      # do the same.
      appenders:
        - type: console
          threshold: INFO
          logFormat: "%d{'yyyy-MM-dd HH:mm:ss,SSSZ'} %level [%thread] %X{username} %logger - %msg%n"
        - type: file
          threshold: ALL
          logFormat: "%d{'yyyy-MM-dd HH:mm:ss,SSSZ'} %level [%thread] %X{username} %logger - %msg%n"
          currentLogFilename: "/sonatype-work/clm-cluster/log/${HOSTNAME}-clm-server.log"
          archivedLogFilenamePattern: "/sonatype-work/clm-cluster/log/${HOSTNAME}-clm-server-%d{yyyy-MM-dd-HH}.log.gz"
          archivedFileCount: 24


  env:
    - name: CLUSTER_DIRECTORY
      value: "/sonatype-work/clm-cluster"
    - name: NEXUS_SECURITY_RANDOMPASSWORD
      value: "false"
    # opensearch-ca-begin
    - name: OPENSEARCH_CA_PEM
      valueFrom:
        secretKeyRef:
          name: nexus-iq-opensearch-ca
          key: ca.pem
    # opensearch-ca-end


  # A private certificate authority for the OpenSearch cluster. search-values.sh keeps the lines
  # between the two markers only when there is one, and deletes them otherwise. Each pod copies
  # the image's JVM trust store to /tmp, adds the authority to the copy, points the JVM at the
  # copy, and then runs the image's own start script. Replacing the JVM's own store would break
  # IQ Server's calls to the Sonatype data services.
  # opensearch-ca-begin
  command: ["/bin/sh", "-c"]
  args:
    - |
      set -e
      printf '%s\n' "$OPENSEARCH_CA_PEM" > /tmp/opensearch-ca.pem
      JVM_CACERTS=$(find / \( -path /sonatype-work -o -path /proc -o -path /sys \) -prune -o -name cacerts -path "*lib/security*" -print 2>/dev/null | head -1)
      KEYTOOL=$(find / \( -path /sonatype-work -o -path /proc -o -path /sys \) -prune -o -name keytool -type f -perm -u+x -print 2>/dev/null | head -1)
      [ -n "$JVM_CACERTS" ] && [ -n "$KEYTOOL" ] || { echo "cacerts=$JVM_CACERTS keytool=$KEYTOOL, one is missing"; exit 1; }
      cp "$JVM_CACERTS" /tmp/opensearch-cacerts
      "$KEYTOOL" -importcert -noprompt -keystore /tmp/opensearch-cacerts -storepass changeit -alias opensearch-ca -file /tmp/opensearch-ca.pem
      export JAVA_OPTS="$JAVA_OPTS -Djavax.net.ssl.trustStore=/tmp/opensearch-cacerts -Djavax.net.ssl.trustStorePassword=changeit"
      exec sh /opt/sonatype/nexus-iq-server/start.sh
  # opensearch-ca-end


  licenseSecret: "nexus-iq-license"

  # helm-install.sh creates this secret from iq_admin_initial_password. IQ Server
  # reads it on its very first start only.
  initialAdminPasswordSecret: "nexus-iq-initial-admin-password"


  database:
    hostname: ""
    port: 5432
    name: "nexusiq"
    username: "nexusiq"
    password: ""


  persistence:
    # helm-install.sh creates this claim, bound to a PersistentVolume on the
    # Terraform-created Azure Files share and sized from storage_share_quota_gb.
    existingPersistentVolumeClaimName: "iq-server-pvc"


  serviceAccountName: "nexus-iq-sa"


  serviceType: "LoadBalancer"
  # Both services get an internal load balancer on a private address in the virtual network.
  # The Application Gateway is the public entry point, and helm-install.sh and helm-upgrade.sh
  # point its backend pool at the application service's private address.
  applicationServiceAnnotations:
    service.beta.kubernetes.io/azure-load-balancer-internal: "true"
    service.beta.kubernetes.io/azure-load-balancer-health-probe-request-path: "/ping"
    service.beta.kubernetes.io/azure-load-balancer-health-probe-protocol: "http"
  adminServiceAnnotations:
    service.beta.kubernetes.io/azure-load-balancer-internal: "true"


  # Number of IQ pods. The chart reads iq_server.replicas and defaults it to 2.
  # This is the Size M value, the HPA minimum. Size L uses 2 and Size XL uses 3.
  # helm-install.sh overwrites it with nexus_iq_replica_count from terraform.tfvars.
  replicas: 2





  # Spread the IQ pods across nodes. The chart labels each IQ pod
  # name: <release>-iq-server, and the scripts install the release as nexus-iq-server-ha.
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: name
                  operator: In
                  values:
                    - nexus-iq-server-ha-iq-server
            topologyKey: "kubernetes.io/hostname"


serviceAccount:
  create: true
  annotations:

    azure.workload.identity/client-id: ""


ingress:
  enabled: false
  ingressClassName: "nginx"
  annotations:

    appgw.ingress.kubernetes.io/backend-path-prefix: "/"
    appgw.ingress.kubernetes.io/ssl-redirect: "false"
    appgw.ingress.kubernetes.io/connection-draining: "true"
    appgw.ingress.kubernetes.io/connection-draining-timeout: "30"
    appgw.ingress.kubernetes.io/request-timeout: "60"
    appgw.ingress.kubernetes.io/health-probe-path: "/ping"
    appgw.ingress.kubernetes.io/health-probe-interval: "30"
    appgw.ingress.kubernetes.io/health-probe-timeout: "30"
    appgw.ingress.kubernetes.io/health-probe-unhealthy-threshold: "3"
  tls: []


# Horizontal pod autoscaler. The chart reads hpa.enabled, hpa.minReplicas and
# hpa.maxReplicas, and renders the HPA only when a resource metric is enabled.
# These are the Size M bounds, 2 to 3. Size L is 2 to 4 and Size XL is 3 to 5.
# Memory is left disabled because the JVM holds its heap, so memory utilization
# stays near the limit and would scale out without bound.
hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 3
  resources:
    cpu:
      enabled: true
      average:
        threshold: 70
    memory:
      enabled: false


# The database migration job runs once, as a post-install hook, so a helm upgrade does
# not start it again while IQ Server is using the database. helm waits for a hook and
# fails the install if the migration fails. When an upgrade changes the IQ Server image,
# MIGRATE_DATABASE=yes ./helm-upgrade.sh scales IQ Server to zero and runs the job as a
# pre-upgrade hook.
iq_server_jobs:
  migrationJobAnnotations:
    "helm.sh/hook": post-install
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
